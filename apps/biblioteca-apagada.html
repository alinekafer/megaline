<title>A Biblioteca Apagada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: cada tela é uma ficha de catálogo de biblioteca (pauta, linha vermelha, carimbo); ECO fala em máquina de escrever ciano. */
:root{
  --ground:#e6e2d6; --card:#fbf8f0; --rule:#d9d2c0; --ink:#1f2328; --muted:#5e5a50;
  --stamp:#b3261e; --stamp-soft:#f3dcd9; --eco:#007f86; --eco-soft:#dff1f0; --ok:#2e6b3a; --ok-soft:#dcebdc;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#14171a; --card:#1d2125; --rule:#30363c; --ink:#ece7da; --muted:#a8a293;
  --stamp:#ef6b5f; --stamp-soft:#3a2321; --eco:#45c9cf; --eco-soft:#15302f; --ok:#7cc48a; --ok-soft:#1d3322; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#14171a; --card:#1d2125; --rule:#30363c; --ink:#ece7da; --muted:#a8a293;
  --stamp:#ef6b5f; --stamp-soft:#3a2321; --eco:#45c9cf; --eco-soft:#15302f; --ok:#7cc48a; --ok-soft:#1d3322; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:22px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.15}
h1{font-weight:800;font-size:clamp(1.9rem,5vw,3rem);letter-spacing:-.01em}
h2{font-weight:800;font-size:clamp(1.35rem,3.4vw,1.9rem)}
h3{font-weight:600;font-size:1.1rem}
p{margin:0}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--eco);outline-offset:2px}

/* ficha de catálogo */
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:22px 22px 20px;position:relative;
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 31px, color-mix(in srgb,var(--rule) 55%,transparent) 31px, color-mix(in srgb,var(--rule) 55%,transparent) 32px);
  background-position:0 58px;display:grid;gap:14px;min-width:0}
.card::before{content:"";position:absolute;left:0;right:0;top:46px;border-top:2px solid color-mix(in srgb,var(--stamp) 70%,transparent)}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:26px}
.hole{width:14px;height:14px;border-radius:50%;background:var(--ground);border:1px solid var(--rule);position:absolute;left:50%;bottom:10px;transform:translateX(-50%)}

/* home */
.hero{display:grid;gap:10px}
.hero p{max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.st{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.st:hover{border-color:var(--stamp)}
.st b{font-size:1.15rem}
.st .n{font-family:var(--mono);color:var(--stamp);font-size:.85rem}
.st small{color:var(--muted);font-size:.85rem;line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* estação */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:30px;height:8px;border-radius:2px;background:var(--rule);display:block}
.steps i.done{background:var(--ok)} .steps i.now{background:var(--stamp)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp)}
.eco{font-family:var(--mono);background:var(--eco-soft);color:var(--ink);border:1px dashed var(--eco);border-radius:4px;padding:12px 14px;font-size:1rem}
.eco::before{content:"ECO > ";color:var(--eco);font-weight:700}
.q{font-weight:600;font-size:1.12rem}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;padding:12px 14px;border:2px solid var(--rule);border-radius:4px;background:var(--card);font-family:var(--mono);font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.answer input:focus{border-color:var(--ink)}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--card);border-radius:4px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.small{padding:6px 12px;font-size:.9rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:2px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:1rem}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,var(--card))}
.feedback{border-radius:4px;padding:10px 14px;font-size:1rem}
.feedback.bad{background:var(--stamp-soft);border-left:4px solid var(--stamp)}
.feedback.good{background:var(--ok-soft);border-left:4px solid var(--ok)}
.hint{font-size:.98rem;color:var(--muted);border-left:3px solid var(--rule);padding-left:12px}
.go{border:2px solid var(--stamp);border-radius:6px;padding:16px;display:grid;gap:8px;background:color-mix(in srgb,var(--stamp) 6%,var(--card))}
.go .where{font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:800;line-height:1.2}
.stamp{display:inline-block;font-family:var(--mono);font-weight:700;color:var(--stamp);border:3px solid var(--stamp);border-radius:4px;padding:2px 10px;transform:rotate(-4deg);letter-spacing:.08em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.letter{font-family:var(--serif);font-weight:800;font-size:clamp(5rem,18vw,9rem);line-height:1;color:var(--stamp)}
.archive{white-space:pre-line;font-size:1.08rem}

/* central */
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(3.6rem,13vw,8rem);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--stamp)}
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
@media (max-width:640px){.slots{grid-template-columns:repeat(5,minmax(0,1fr))}}
.slot{display:grid;gap:4px;justify-items:center;align-content:start}
.slot input{width:100%;aspect-ratio:3/4;max-width:90px;text-align:center;font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,5vw,3rem);text-transform:uppercase;border:2px solid var(--rule);border-radius:4px;background:var(--card);padding:0}
.slot small{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.slot input.ok{border-color:var(--ok)}
.win{border:3px solid var(--ok)}

/* rádio */
.radio{display:grid;gap:18px;justify-items:center;text-align:center;padding-block:30px}
.play{width:160px;height:160px;border-radius:50%;border:4px solid var(--eco);background:var(--eco-soft);font-family:var(--mono);font-weight:700;font-size:1.1rem;color:var(--ink)}

/* professor */
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--rule);text-align:left;padding:6px 8px;vertical-align:top}
th{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.qrs{display:flex;flex-wrap:wrap;gap:16px}
.qrbox{display:grid;gap:6px;justify-items:center;background:#fff;color:#111;padding:12px;border-radius:6px;border:1px solid var(--rule)}
.qrbox img,.qrbox canvas{width:180px!important;height:180px!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const C = DATA.config, E = DATA.estacoes, L = DATA.locais;
const root = document.getElementById("root");
const est = n => E.find(e => e.n === n);
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls = {
  get(k, d){ try { const v = localStorage.getItem("bibapagada-"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("bibapagada-"+k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem("bibapagada-"+k); } catch(e){} }
};
let mem = {}; // fallback quando o navegador não guarda dados
function prog(n){ return ls.get("prog-"+n, null) || mem[n] || {stage:0, hints:[0,0,0,0], solved:[false,false,false,false]}; }
function saveProg(n,p){ mem[n]=p; ls.set("prog-"+n,p); }

// ---------- etapas de uma estação ----------
function stages(s){
  const par = est(s.parceira);
  return [
    { nome:"Restaurar o texto", tipo:s.e1.tipo, eco:s.e1.eco, pergunta:s.e1.pergunta, opcoes:s.e1.opcoes, certa:s.e1.certa,
      respostas:s.e1.respostas, dicas:s.e1.dicas, explica:s.e1.explica },
    { nome:"A carta cruzada", tipo:"texto",
      pergunta:"Digitem o código da carta que chegou na caixa de correio desta estação.",
      respostas:[par.envelope.codigo], dicas:["A carta foi encontrada pela Estação "+par.n+" ("+par.simbolo+") e deve estar na caixa de correio ao lado deste computador. Se ainda não chegou, procurem a equipe "+par.equipe+".", "O código aparece no fim da carta, depois de \"Código:\"."],
      explica:"Carta recebida. A Estação "+par.n+" ("+par.simbolo+") guarda a outra metade da sua história." },
    { nome:"O outro lado", tipo:"texto", instrucao:s.e3.instrucao, pergunta:s.e3.pergunta, respostas:s.e3.respostas, dicas:s.e3.dicas, explica:s.e3.explica },
    { nome:"Prova final", tipo:"texto", instrucao:s.e4.instrucao, pergunta:"Digitem a palavra-código.", respostas:s.e4.respostas, dicas:s.e4.dicas, explica:s.e4.explica }
  ];
}
function checa(st, val){
  if(st.tipo==="escolha") return val===st.certa;
  const v = norm(val); return st.respostas.some(r => norm(r)===v);
}
const deboche = ["Errado. Eu teria acertado. Talvez.","Quase. Mentira, nem perto.","Isso está tão certo quanto as minhas correções.","Tentem de novo. Eu tenho todo o tempo do mundo. Vocês, não."];

function viewEstacao(n){
  const s = est(n); if(!s){ return viewHome(); }
  ls.set("minha", n);
  const par = est(s.parceira), tr = DATA.tramas.find(t=>t.id===s.trama);
  const p = prog(n), sts = stages(s);
  const tab = viewEstacao.tab || "missao";
  root.innerHTML = `
    <div class="topbar">
      <a class="label" href="#">← todas as estações</a>
      <div class="steps" aria-label="Etapa ${Math.min(p.stage+1,4)} de 4">${sts.map((_,i)=>`<i class="${i<p.stage?'done':i===p.stage?'now':''}"></i>`).join("")}</div>
    </div>
    <header style="display:grid;gap:4px">
      <span class="label">Estação ${s.n} · ${esc(s.simbolo)} · Trama ${tr.id}: ${esc(tr.nome)}</span>
      <h1>${esc(s.equipe)}</h1>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-missao" aria-selected="${tab==='missao'}">Missão</button>
      <button class="tab" role="tab" id="t-arquivo" aria-selected="${tab==='arquivo'}">Arquivo desta estação</button>
    </div>
    <section class="card" id="panel"></section>`;
  document.getElementById("t-missao").onclick=()=>{viewEstacao.tab="missao";viewEstacao(n);};
  document.getElementById("t-arquivo").onclick=()=>{viewEstacao.tab="arquivo";viewEstacao(n);};
  const panel = document.getElementById("panel");
  if(tab==="arquivo"){
    panel.innerHTML = `<div class="head"><span class="label">Arquivo · Estação ${s.n}</span><span class="label">${esc(s.simbolo)}</span></div>
      <p class="hint">Este texto foi guardado aqui para a ${esc(par.equipe)} (Estação ${par.n}). Qualquer equipe pode ler.</p>
      <h2>${esc(s.arquivo.titulo)}</h2><p class="archive">${esc(s.arquivo.texto)}</p><span class="hole"></span>`;
    return;
  }
  if(p.stage>=4){
    panel.innerHTML = `<div class="head"><span class="label">Fragmento restaurado</span><span class="stamp">RESTAURADO</span></div>
      <p>Vocês recuperaram a letra da posição <b>${s.posicao}</b> da senha que desliga ECO.</p>
      <div class="letter" aria-label="Letra ${s.letra}">${s.letra}</div>
      <div class="go"><span class="label">Agora</span><p class="where">Levem a letra ${s.letra} (posição ${s.posicao}) ao Terminal Central.</p>
      <p>Lá, as dez equipes juntam as letras. Enquanto esperam, ajudem as equipes que ainda estão em campo, sem entregar respostas.</p></div>
      <p class="label">Dicas usadas: ${p.hints.reduce((a,b)=>a+b,0)}</p><span class="hole"></span>`;
    return;
  }
  const i = p.stage, st = sts[i];
  let html = `<div class="head"><span class="label">Etapa ${i+1} de 4 · ${esc(st.nome)}</span><span class="label">${esc(s.simbolo)}</span></div>`;
  if(i===0) html += `<p>${esc(s.abertura)}</p><p class="eco">${esc(st.eco)}</p>`;
  if(i===1) html += missaoCampo(s, par);
  if(st.instrucao) html += `<div class="go"><span class="label">${i===2?'Em movimento':'Fora da sala'}</span><p>${esc(st.instrucao)}</p></div>`;
  html += `<p class="q">${esc(st.pergunta)}</p>`;
  if(st.tipo==="escolha"){
    html += `<div class="opts" id="opts">${st.opcoes.map((o,k)=>`<button class="opt" data-k="${k}" type="button">${String.fromCharCode(65+k)}) ${esc(o)}</button>`).join("")}</div>
      <div class="row"><button class="btn" id="ok" type="button">Conferir</button></div>`;
  } else {
    html += `<form class="answer" id="f"><input id="ans-${n}-${i}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Resposta"><button class="btn" type="submit">Conferir</button></form>`;
  }
  html += `<div id="fb"></div><div id="hints">${st.dicas.slice(0,p.hints[i]).map((d,k)=>`<p class="hint">Dica ${k+1}: ${esc(d)}</p>`).join("")}</div>`;
  if(p.hints[i] < st.dicas.length) html += `<div class="row"><button class="btn ghost small" id="hintBtn" type="button">Pedir dica (${p.hints[i]+1} de ${st.dicas.length})</button></div>`;
  html += `<span class="hole"></span>`;
  panel.innerHTML = html;
  let escolha = null;
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ escolha=+b.dataset.k; panel.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b)); });
  const hb = document.getElementById("hintBtn");
  if(hb) hb.onclick=()=>{ p.hints[i]++; saveProg(n,p); viewEstacao(n); };
  const tenta = val=>{
    const fb = document.getElementById("fb");
    if(checa(st,val)){
      p.solved[i]=true; saveProg(n,p);
      fb.innerHTML = `<div class="feedback good"><b>Restaurado.</b> ${esc(st.explica)}</div><div class="row" style="margin-top:12px"><button class="btn" id="next" type="button">${i===3?'Ver a letra':'Continuar'}</button></div>`;
      panel.querySelectorAll("input,.opt,#ok,form button,#hintBtn").forEach(el=>el.disabled=true);
      document.getElementById("next").onclick=()=>{ p.stage=i+1; saveProg(n,p); viewEstacao(n); window.scrollTo({top:0}); };
      document.getElementById("next").focus();
    } else {
      fb.innerHTML = `<div class="feedback bad"><span class="mono">ECO &gt;</span> ${esc(deboche[Math.floor(Math.random()*deboche.length)])}</div>`;
      panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake");
    }
  };
  const f = document.getElementById("f");
  if(f){ f.onsubmit=e=>{ e.preventDefault(); tenta(f.querySelector("input").value); }; f.querySelector("input").focus({preventScroll:true}); }
  const ok = document.getElementById("ok"); if(ok) ok.onclick=()=>{ if(escolha===null){ document.getElementById("fb").innerHTML=`<div class="feedback bad">Escolham uma das versões primeiro.</div>`; return;} tenta(escolha); };
}
function missaoCampo(s, par){
  return `<div class="go"><span class="label">Missão de campo</span>
    <p class="where">${esc(L[s.local])}</p>
    <p>Procurem o envelope com o símbolo <b>${esc(s.simbolo)}</b>. Ele <b>não é de vocês</b>: é uma carta para a ${esc(par.equipe)} (Estação ${par.n}, ${esc(par.simbolo)}). Entreguem na caixa de correio ao lado do computador da Estação ${par.n}.</p>
    <p>Enquanto isso, a ${esc(par.equipe)} está buscando a carta de vocês. Ela vai chegar na caixa de correio desta estação.</p></div>`;
}

// ---------- terminal central ----------
let timerInt=null;
function viewCentral(){
  const t = ls.get("timer",{fim:null,resta:C.duracao_min*60,rodando:false});
  const letras = ls.get("letras", Array(10).fill(""));
  const ganhou = ls.get("ganhou", false);
  root.innerHTML = `
    <div class="topbar"><a class="label" href="#">← início</a><span class="label">Terminal Central</span></div>
    <section class="card ${ganhou?'win':''}" style="justify-items:center;text-align:center">
      <div class="head" style="width:100%"><span class="label">${esc(C.titulo)}</span><span class="label">Senha de desligamento</span></div>
      ${ganhou ? `<span class="stamp" style="font-size:1.4rem">ECO DESLIGADA</span>
        <h2>A biblioteca foi restaurada.</h2>
        <p style="max-width:60ch">As dez equipes juntaram as letras. Nenhuma conseguiria sozinha: cada trama dependia da outra metade da história.</p>`
      : `<div class="timer" id="timer">--:--</div>
        <p class="eco" id="ecoMsg" style="text-align:left">${esc(DATA.eco_central[0])}</p>`}
      <div class="slots" style="width:100%">${E.map((s,k)=>`<label class="slot"><input id="slot-${k}" maxlength="1" value="${esc(letras[k]||'')}" ${ganhou?'disabled':''} aria-label="Letra da posição ${k+1}"><small>${k+1} · ${esc(s.simbolo)}</small></label>`).join("")}</div>
      ${ganhou ? `<div style="text-align:left;width:100%;display:grid;gap:8px"><h3>Conversa final</h3><ol style="margin:0;padding-left:1.2em;display:grid;gap:6px">${DATA.debate.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>`
      : `<div class="row" style="justify-content:center"><button class="btn" id="start" type="button">${t.rodando?'Pausar':'Iniciar cronômetro'}</button><button class="btn ghost" id="reset" type="button">Zerar</button></div>`}
      <div id="cfb" style="width:100%"></div><span class="hole"></span>
    </section>
    <p class="hint">Cada equipe digita a sua letra na posição indicada na tela da estação. Quando as dez letras estiverem certas, ECO desliga.</p>`;
  const inputs = [...document.querySelectorAll(".slot input")];
  inputs.forEach((inp,k)=>{
    inp.oninput=()=>{ inp.value=norm(inp.value).slice(-1); letras[k]=inp.value; ls.set("letras",letras); if(inp.value && inputs[k+1]) inputs[k+1].focus(); confere(); };
  });
  function confere(){
    const w = letras.join("");
    if(w.length===10){
      if(w===norm(C.senha_final)){ ls.set("ganhou",true); clearInterval(timerInt); viewCentral(); }
      else document.getElementById("cfb").innerHTML=`<div class="feedback bad"><span class="mono">ECO &gt;</span> Senha errada. Confiram as posições: cada estação mostra o número da sua letra.</div>`;
    }
  }
  if(ganhou) return;
  const tel = document.getElementById("timer");
  const draw=()=>{
    let r = t.rodando ? Math.max(0,Math.round((t.fim-Date.now())/1000)) : t.resta;
    tel.textContent = String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");
    tel.classList.toggle("low", r<=300);
    const idx = Math.min(DATA.eco_central.length-1, Math.floor((C.duracao_min*60-r)/((C.duracao_min*60)/DATA.eco_central.length)));
    const m = document.getElementById("ecoMsg"); if(m) m.textContent = DATA.eco_central[idx];
    if(r===0 && t.rodando){ t.rodando=false; t.resta=0; ls.set("timer",t); clearInterval(timerInt); m.textContent="ECO: O tempo acabou. Mas o professor pode me dar mais uns minutos. Ele é generoso; eu não."; }
  };
  clearInterval(timerInt); draw(); timerInt=setInterval(draw,500);
  document.getElementById("start").onclick=()=>{
    if(t.rodando){ t.resta=Math.max(0,Math.round((t.fim-Date.now())/1000)); t.rodando=false; }
    else { t.fim=Date.now()+t.resta*1000; t.rodando=true; }
    ls.set("timer",t); viewCentral();
  };
  document.getElementById("reset").onclick=()=>{ ls.set("timer",{fim:null,resta:C.duracao_min*60,rodando:false}); ls.set("letras",Array(10).fill("")); ls.del("ganhou"); viewCentral(); };
}

// ---------- rádio (celular) ----------
function viewRadio(n){
  const s = est(n); if(!s || s.e4.tipo!=="radio") return viewHome();
  root.innerHTML = `<section class="radio">
    <span class="label">Rádio ECO · ${esc(s.simbolo)}</span>
    <h1>Transmissão ${n}</h1>
    <p style="max-width:40ch">Aumentem o volume e escutem com atenção. ECO só fala uma vez de cada vez.</p>
    <button class="play" id="play" type="button">▶ OUVIR</button>
    <button class="btn ghost small" id="txt" type="button">O áudio não funcionou</button>
    <p class="eco" id="texto" hidden style="text-align:left;max-width:40ch">${esc(s.e4.radio)}</p>
    <p class="hint">Depois de ouvir, voltem ao computador da Estação ${n} e digitem a palavra.</p></section>`;
  document.getElementById("play").onclick=()=>{
    if(!("speechSynthesis" in window)){ document.getElementById("texto").hidden=false; return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(s.e4.radio); u.lang="pt-BR"; u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^pt/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  };
  document.getElementById("txt").onclick=()=>{ document.getElementById("texto").hidden=false; };
}

// ---------- professor ----------
function viewProfessor(){
  if(!viewProfessor.ok){
    root.innerHTML = `<div class="topbar"><a class="label" href="#">← início</a></div>
      <section class="card" style="max-width:520px"><div class="head"><span class="label">Área do professor</span></div>
      <p>Digite a senha do professor para ver o gabarito e a preparação.</p>
      <form class="answer" id="pf"><input id="pin" type="password" aria-label="Senha do professor" style="text-transform:none"><button class="btn" type="submit">Entrar</button></form><div id="pfb"></div><span class="hole"></span></section>`;
    document.getElementById("pf").onsubmit=e=>{ e.preventDefault(); if(document.getElementById("pin").value.trim().toLowerCase()===C.pin){ viewProfessor.ok=true; viewProfessor(); } else document.getElementById("pfb").innerHTML=`<div class="feedback bad">Senha incorreta.</div>`; };
    return;
  }
  const base = location.href.split("#")[0];
  const linhas = E.map(s=>{ const par=est(s.parceira); return `<tr><td><b>${s.n}</b> ${esc(s.simbolo)}<br><small>${esc(s.equipe)}</small></td>
    <td>${s.e1.tipo==="escolha" ? "Alternativa "+String.fromCharCode(65+s.e1.certa) : esc(s.e1.respostas[0])}</td>
    <td>${esc(par.envelope.codigo)}<br><small>carta achada pela Est. ${par.n} em: ${esc(L[par.local])}</small></td>
    <td>${esc(s.e3.respostas[0])}</td>
    <td>${esc(s.e4.respostas[0])}<br><small>${esc({guardiao:"Guardião",entrevista:"Entrevista",radio:"Rádio ECO (celular)",vela:"Vela escondida"}[s.e4.tipo])} · ${esc(L[s.e4.local])}</small></td>
    <td><b>${s.letra}</b> (${s.posicao})</td></tr>`; }).join("");
  root.innerHTML = `<div class="topbar"><a class="label" href="#">← início</a><span class="label">Área do professor</span></div>
    <h1>Gabarito e preparação</h1>
    <section class="card"><div class="head"><span class="label">Respostas por estação</span></div>
      <div class="scroll"><table><thead><tr><th>Estação</th><th>Etapa 1</th><th>Etapa 2 (carta)</th><th>Etapa 3</th><th>Etapa 4</th><th>Letra</th></tr></thead><tbody>${linhas}</tbody></table></div>
      <p class="hint">Senha final: <b>${esc(C.senha_final)}</b>. Cada resposta aceita variações sem acento e algumas formas alternativas.</p><span class="hole"></span></section>
    <section class="card"><div class="head"><span class="label">Rádio ECO · QR codes para os cartazes</span></div>
      <p>Se publicar o jogo em outro endereço, use estes códigos, gerados a partir do endereço atual.</p>
      <div class="qrs" id="qrs"></div><span class="hole"></span></section>
    <section class="card"><div class="head"><span class="label">Este computador</span></div>
      <p>Apaga o progresso salvo neste navegador (todas as estações e o terminal central). Use antes de cada turma.</p>
      <div class="row"><button class="btn ghost" id="zera" type="button">Apagar progresso deste computador</button><span id="zfb" class="label"></span></div><span class="hole"></span></section>`;
  const q = document.getElementById("qrs");
  E.filter(s=>s.e4.tipo==="radio").forEach(s=>{
    const box=document.createElement("div"); box.className="qrbox"; const inner=document.createElement("div"); box.appendChild(inner);
    const cap=document.createElement("b"); cap.textContent="Rádio ECO "+s.n; box.appendChild(cap); q.appendChild(box);
    const url = base+"#radio-"+s.n;
    if(window.QRCode) new QRCode(inner,{text:url,width:360,height:360,correctLevel:QRCode.CorrectLevel.M}); else inner.textContent=url;
  });
  document.getElementById("zera").onclick=()=>{ for(let k=1;k<=10;k++) ls.del("prog-"+k); mem={}; ["timer","letras","ganhou","minha"].forEach(ls.del); document.getElementById("zfb").textContent="Progresso apagado."; };
}

// ---------- início ----------
function viewHome(){
  const minha = ls.get("minha", null);
  root.innerHTML = `
    <header class="hero"><span class="label">Escape room de Língua Portuguesa · 10 equipes</span>
      <h1>${esc(C.titulo)}</h1><p>${esc(DATA.abertura_geral)}</p></header>
    ${minha ? `<div class="row"><a class="btn" href="#estacao-${minha}">Voltar à Estação ${minha}</a></div>` : ""}
    <section style="display:grid;gap:10px"><h2>Escolham a estação deste computador</h2>
      <div class="grid">${E.map(s=>`<a class="st" href="#estacao-${s.n}" style="text-decoration:none"><span class="n">Estação ${s.n}</span><b>${esc(s.simbolo)}</b><small>${esc(s.equipe)} · ${esc(DATA.tramas.find(t=>t.id===s.trama).nome)}</small></a>`).join("")}</div></section>
    <div class="row"><a class="btn ghost" href="#central">Terminal Central (projetor)</a><a class="btn ghost" href="#professor">Área do professor</a></div>`;
}

function rota(){
  clearInterval(timerInt);
  if(window.speechSynthesis) speechSynthesis.cancel();
  const h = location.hash.replace("#","");
  let m;
  if((m=h.match(/^estacao-(\d+)$/))) { viewEstacao.tab="missao"; return viewEstacao(+m[1]); }
  if((m=h.match(/^radio-(\d+)$/))) return viewRadio(+m[1]);
  if(h==="central") return viewCentral();
  if(h==="professor") return viewProfessor();
  viewHome();
}
window.addEventListener("hashchange", ()=>{ rota(); window.scrollTo({top:0}); });
rota();
</script>
